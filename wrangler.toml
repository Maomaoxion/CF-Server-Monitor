# Cloudflare Workers 配置。线上由 Cloudflare 的 Git 集成（Workers Builds）执行：
#   build  : npm run build:frontend
#   deploy : npx wrangler deploy
# 只保留部署必需的 name 与 D1 绑定；自定义域名由 Cloudflare 面板的 Custom Domain 管理，
# 不在本文件声明（Wrangler 文档：移除 routes 键后由面板接管）。
# API_SECRET / API_USER_NAME 在 Worker 的 Variables and Secrets 里设置，keep_vars 保证不被覆盖。
name = "server-monitor-pro"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "047109e7-3d0e-482b-8005-5cf4140841b9"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
